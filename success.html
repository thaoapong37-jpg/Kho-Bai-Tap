<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thành công</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .success-card { background: #ffffff; padding: 40px 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
        .icon-circle { width: 70px; height: 70px; background-color: #dcfce7; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .icon-circle svg { width: 40px; height: 40px; fill: #16a34a; }
        h2 { color: #1e293b; font-size: 22px; margin-bottom: 10px; }
        p { color: #64748b; font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        .btn-home { display: inline-block; width: 100%; padding: 13px; background-color: #2563eb; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 15px; }
        .btn-home:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="icon-circle">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
        <h2>Đăng ký thành công!</h2>
        <p>Tài khoản của bạn đã được khởi tạo. Bạn có thể đăng nhập để bắt đầu trải nghiệm hệ thống ngay bây giờ.</p>
        <a href="register.html" class="btn-home">Đăng nhập ngay</a>
    </div>

</body>
</html>
